version: '3.8'

# Simplified Portainer-compatible version

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: data_pipeline_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: data_pipeline_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: data_pipeline_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.3
    container_name: data_pipeline_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Label Studio (replaces Argilla - better for audio + text annotation)
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: data_pipeline_label_studio
    ports:
      - "8081:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_HOST=postgres
      - POSTGRE_PORT=5432
    volumes:
      - label_studio_data:/label-studio/data
      - label_studio_files:/label-studio/files
    restart: unless-stopped

  # Whisper API (for automatic transcription)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: data_pipeline_whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=large-v2
      - ASR_ENGINE=openai_whisper
    volumes:
      - whisper_models:/root/.cache/whisper
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G

  # Prefect
  prefect-server:
    image: prefecthq/prefect:2-python3.11
    container_name: data_pipeline_prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    command: prefect server start
    volumes:
      - prefect_data:/root/.prefect
    restart: unless-stopped

  # Flower
  flower:
    image: mher/flower:0.9.7
    container_name: data_pipeline_flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery flower --broker=redis://redis:6379/0
    restart: unless-stopped

  # Code Server (VS Code in Browser) - for editing code
  code-server:
    image: codercom/code-server:latest
    container_name: data_pipeline_code_editor
    ports:
      - "8080:8080"
    environment:
      PASSWORD: datapipeline
    volumes:
      - app_code:/home/coder/project
      - code_server_data:/home/coder/.local
    command: code-server --auth password --bind-addr 0.0.0.0:8080 /home/coder/project
    restart: unless-stopped

  # React Frontend
  frontend-react:
    image: node:20-alpine
    container_name: data_pipeline_frontend_react
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend-react:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  label_studio_data:
  label_studio_files:
  whisper_models:
  elasticsearch_data:
  prefect_data:
  code_server_data:
  app_code:
  node_modules:
