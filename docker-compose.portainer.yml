version: '3.8'

# Portainer-compatible version - clones code from GitHub

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: data_pipeline_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    container_name: data_pipeline_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow Tracking Server (simplified - uses SQLite)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: data_pipeline_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  # Elasticsearch for Argilla
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.3
    container_name: data_pipeline_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Argilla for Human Annotation
  argilla:
    image: argilla/argilla-server:latest
    container_name: data_pipeline_argilla
    ports:
      - "6900:6900"
    environment:
      ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
      ARGILLA_HOME_PATH: /var/lib/argilla
      ARGILLA_AUTH_SECRET_KEY: supersecretkey
    volumes:
      - argilla_data:/var/lib/argilla
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Prefect Server
  prefect-server:
    image: prefecthq/prefect:2-python3.11
    container_name: data_pipeline_prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    command: prefect server start
    volumes:
      - prefect_data:/root/.prefect

  # Flower (Celery Monitoring)
  flower:
    image: mher/flower:0.9.7
    container_name: data_pipeline_flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery flower --broker=redis://redis:6379/0
    depends_on:
      - redis

  # FastAPI Backend (clones from GitHub)
  api:
    image: python:3.11-slim
    container_name: data_pipeline_api
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/data_pipeline
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ARGILLA_API_URL: http://argilla:6900
      PREFECT_API_URL: http://prefect-server:4200/api
      GIT_REPO: https://github.com/williamcheong0616/DataSupportTool.git
    command: >
      bash -c "
        apt-get update && apt-get install -y git curl &&
        if [ ! -d /app/.git ]; then
          git clone $${GIT_REPO} /tmp/repo && cp -r /tmp/repo/* /app/ && rm -rf /tmp/repo
        fi &&
        pip install --no-cache-dir -r requirements.txt &&
        uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload
      "
    depends_on:
      - postgres
      - redis
    volumes:
      - app_code:/app

  # Streamlit Frontend (shares code volume with api)
  frontend:
    image: python:3.11-slim
    container_name: data_pipeline_frontend
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/api
    command: >
      bash -c "
        apt-get update && apt-get install -y curl &&
        while [ ! -f /app/requirements.txt ]; do echo 'Waiting for code...'; sleep 5; done &&
        pip install --no-cache-dir -r requirements.txt &&
        streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
      "
    depends_on:
      - api
    volumes:
      - app_code:/app

  # Code Server (VS Code in Browser)
  code-server:
    image: codercom/code-server:latest
    container_name: data_pipeline_code_editor
    ports:
      - "8080:8080"
    environment:
      PASSWORD: "datapipeline"
    volumes:
      - app_code:/home/coder/project
      - code_server_data:/home/coder/.local
    command: >
      code-server
      --auth password
      --bind-addr 0.0.0.0:8080
      /home/coder/project
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  argilla_data:
  elasticsearch_data:
  prefect_data:
  code_server_data:
  app_code:
